name: Publish image to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "镜像版本号（留空则使用 v1.0.0-rc.37-glser.1）"
        required: false
        type: string
      git_ref:
        description: "要打包的分支、标签或提交"
        required: false
        type: string
        default: main

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-acr
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-pd9pvjyewqjvbrn0.cn-beijing.personal.cr.aliyuncs.com
  ACR_REPOSITORY: glser/new-api
  DEFAULT_IMAGE_TAG: v1.0.0-rc.37-glser.1

jobs:
  build_and_push:
    name: Build linux/amd64 and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check ACR secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::Missing GitHub Actions secrets ACR_USERNAME and/or ACR_PASSWORD."
            echo "Add them at Settings → Secrets and variables → Actions."
            echo "ACR_USERNAME should be the Aliyun Docker login user, e.g. aliyun3444160180."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Resolve image tag and write VERSION
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${DEFAULT_IMAGE_TAG}"
          fi
          echo "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$' || {
            echo "::error::Invalid image tag: $TAG"
            exit 1
          }
          printf '%s\n' "$TAG" > VERSION
          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "tag=$TAG"
            echo "image=${ACR_REGISTRY}/${ACR_REPOSITORY}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${ACR_REGISTRY}/${ACR_REPOSITORY}:$TAG ($SHORT_SHA)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Aliyun ACR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Glser/new-api
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            io.oioi.build.variant=licensefix.1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Aliyun ACR"
            echo "- image: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.tag }}\`"
            echo "- sha tag: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.meta.outputs.short_sha }}\`"
            echo "- commit: \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
